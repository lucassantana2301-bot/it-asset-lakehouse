version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dagster:
        patterns: ['dagster*']
      dbt:
        patterns: ['dbt-*']
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
