name: Release

# Release automática: quando a versão muda na main e ainda não existe a release, roda o CI
# completo, publica os artefatos e cria a tag vX.Y.Z e a release com as notas do CHANGELOG.
# Também aceita tag enviada à mão e disparo manual pela aba Actions.

on:
  push:
    branches: [main]
    paths:
      - src/lakehouse/__init__.py
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Versão a publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="v$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' src/lakehouse/__init__.py)"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versão inválida: $version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME diferente da versão do projeto ($version)"
            exit 1
          fi
          scripts/changelog-section.sh "${version#v}" > /dev/null
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version já existe; nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: CI
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub Release
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Artefatos
        run: pipx run build --outdir dist .
      - name: Cria a tag e a release com as notas do CHANGELOG
        run: |
          {
            scripts/changelog-section.sh "${VERSION#v}"
            echo
            echo "### Instalação"
            echo
            echo '```bash'
            echo "uv tool install \"it-asset-lakehouse @ https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/it_asset_lakehouse-${VERSION#v}-py3-none-any.whl\""
            echo '```'
          } > notes.md
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
