name: Pages

# Publica no GitHub Pages (branch gh-pages):
#   /            painel executivo gerado a partir dos marts
#   /dbt/        documentação e linhagem do dbt (página única, sem servidor)
#   /coverage/   relatório de cobertura dos testes
#   /badges/     JSON do badge de cobertura (shields.io)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Painel, docs do dbt e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANDING_ROOT: ${{ github.workspace }}/data/landing
      LAKE_ROOT: ${{ github.workspace }}/data/lake
      DBT_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/locabit.duckdb
      SITE_ROOT: ${{ github.workspace }}/site
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen

      - name: Testes com cobertura
        run: uv run pytest --cov --cov-report=html:site/coverage --cov-report=json:coverage.json

      - name: Pipeline e painel
        run: |
          uv run lakehouse run
          uv run lakehouse report --revision "$GITHUB_SHA"

      - name: Documentação do dbt
        run: |
          uv run dbt docs generate --static --project-dir dbt --profiles-dir dbt
          mkdir -p site/dbt
          cp dbt/target/static_index.html site/dbt/index.html

      - name: Badge e arquivos do site
        run: |
          uv run python scripts/coverage_badge.py coverage.json site/badges/coverage.json
          rm -f site/coverage/.gitignore
          touch site/.nojekyll

      - name: Publica na branch gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
