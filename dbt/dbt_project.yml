name: locabit
version: '1.0.0'
config-version: 2
profile: locabit

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
target-path: target
clean-targets: [target, dbt_packages]

flags:
  require_explicit_package_overrides_for_builtin_materializations: true

models:
  locabit:
    staging:
      +materialized: view
      +schema: staging
      +meta: {dagster: {group: staging}}
    intermediate:
      +materialized: table
      +schema: intermediate
      +meta: {dagster: {group: intermediate}}
    marts:
      +materialized: table
      +schema: marts
      +meta: {dagster: {group: marts}}
      +contract:
        enforced: true

data_tests:
  locabit:
    +severity: error
