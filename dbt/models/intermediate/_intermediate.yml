version: 2

models:
  - name: int_contract_history
    description: >
      Histórico SCD tipo 2 dos contratos. valid_to é exclusivo e nulo na versão vigente.
    columns:
      - name: contract_version_id
        data_tests: [unique, not_null]
      - name: valid_from
        data_tests:
          - not_null
          - valid_interval:
              arguments: {end_column: valid_to}

  - name: int_customer_mrr_monthly
    description: MRR por cliente no fechamento de cada mês.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [customer_id, month_start]
    columns:
      - name: mrr
        data_tests: [non_negative]

  - name: int_asset_daily_utilization
    description: Agregado diário de telemetria por equipamento do inventário.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [asset_id, event_date]

  - name: int_telemetry_orphans
    description: Eventos de telemetria cujo asset_id não existe no inventário.
