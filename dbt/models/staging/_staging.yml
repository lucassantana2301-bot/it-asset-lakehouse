version: 2

models:
  - name: stg_customers
    description: Cadastro atual de clientes, com CNPJ só com dígitos.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: cnpj
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: [SMB, Mid-Market, Enterprise]

  - name: stg_contracts_daily
    description: Foto diária de cada contrato, base do histórico SCD2.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [contract_id, snapshot_date]
    columns:
      - name: contract_id
        data_tests: [not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: monthly_fee
        data_tests: [non_negative]

  - name: stg_assets
    description: Estado atual de cada equipamento.
    columns:
      - name: asset_id
        data_tests: [unique, not_null]
      - name: serial_number
        data_tests: [unique]
      - name: purchase_cost
        data_tests: [non_negative]

  - name: stg_telemetry
    description: Eventos de telemetria deduplicados por event_id.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: cpu_util_pct
        data_tests:
          - between:
              arguments: {min_value: 0, max_value: 100}
      - name: asset_id
        description: Pode referenciar equipamento fora do inventário (agente instalado à mão); tratado em int_telemetry_orphans.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_assets')
                field: asset_id
              config:
                severity: warn

  - name: stg_tickets
    description: Estado mais recente de cada chamado.
    columns:
      - name: ticket_id
        data_tests: [unique, not_null]
      - name: opened_at
        data_tests:
          - not_null
          - valid_interval:
              arguments: {end_column: closed_at}

  - name: stg_shipments
    description: Estado mais recente de cada envio ou coleta.
    columns:
      - name: shipment_id
        data_tests: [unique, not_null]
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: [outbound, return]

  - name: stg_ingestion_manifests
    description: Um registro por fonte e partição ingerida, com contagens de linhas válidas e em quarentena.
    data_tests:
      - unique_combination:
          arguments:
            combination_of_columns: [source, partition_date]
